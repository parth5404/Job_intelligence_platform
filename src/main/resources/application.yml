spring:
  application:
    name: job-intelligence

  datasource:
    url: jdbc:postgresql://localhost:5432/job_intelligence
    username: job_intelligence
    password: job_intelligence_dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper

  flyway:
    enabled: true

security:
  jwt:
    # Required: no default on purpose. Provide a random value of at least 32 bytes via the environment.
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:7d}
    issuer: job-intelligence

llm:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-3.5-flash-lite

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

job-sources:
  greenhouse:
    board-token: ${GREENHOUSE_BOARD_TOKEN}

job-intelligence:
  matching:
    daily-cron: "0 0 2 * * *"